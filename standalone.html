<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共此天色 · 同一个时刻，不同的天空</title>
<meta name="description" content="默认展示当前位置的实时天气，可添加城市横向对照逐时气温与未来七日预报。时间统一为北京时间。">
<meta name="theme-color" content="#0f1728">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f1728'/%3E%3Cpath d='M7 22a9 9 0 0 1 18 0M3.5 22h25' fill='none' stroke='%23f2c14e' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://air-quality-api.open-meteo.com" crossorigin>
<style>
/* =========================================================================
   共此天色 · 城市天气对照
   One page, one type system: serif display (Songti) + sans data (PingFang).
   Palette: neutral paper, pine accent, weather-coloured sky bands.
   ========================================================================= */

:root {
  --paper: #f3f2ee;
  --paper-2: #eae8e1;
  --paper-3: #e1ded4;
  --ink: #191a18;
  --ink-soft: #3c3d38;
  --muted: #6b6a61;
  --accent: #1f5a48;
  --accent-deep: #164336;
  --accent-soft: #e2e9e4;
  --accent-ink: #f7f6f0;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shell: 1280px;
  --pad: clamp(20px, 4.2vw, 52px);
  --ease: cubic-bezier(.2, .72, .2, 1);
  --chart-grid: rgba(25, 26, 24, .1);
  --chart-grid-strong: rgba(25, 26, 24, .22);
  --edge: rgba(25, 26, 24, .1);
  --shadow-float: 0 30px 80px -24px rgba(18, 22, 20, .38), 0 2px 10px rgba(18, 22, 20, .08);
}

/* ---------- reset ---------- */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, p, figure { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
table { border-collapse: collapse; }
::selection { background: var(--accent); color: var(--accent-ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.sky :focus-visible { outline-color: currentColor; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.skip-link {
  position: absolute;
  left: 16px; top: -60px;
  z-index: 60;
  padding: 10px 16px;
  background: var(--ink);
  color: var(--paper);
  text-decoration: none;
  font-size: 14px;
  transition: top .2s var(--ease);
}
.skip-link:focus { top: 12px; }

/* ---------- shared bits ---------- */

.glyph {
  width: 1em; height: 1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.ui-icon {
  width: 18px; height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .01em;
  cursor: pointer;
  transition: background-color .18s var(--ease), color .18s var(--ease), opacity .18s var(--ease);
}

.btn--quiet { padding: 0 10px; color: var(--ink-soft); }
.btn--quiet:hover { background: var(--paper-2); color: var(--ink); }

.btn--solid { background: var(--accent); color: var(--accent-ink); }
.btn--solid:hover { background: var(--accent-deep); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: progress; }

.btn.is-loading .ui-icon { animation: spin 1.1s linear infinite; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px; height: 40px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background-color .18s var(--ease), color .18s var(--ease);
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }

.link-btn {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 13px;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.link-btn:hover { color: var(--accent-deep); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: none; }
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse {
  0%, 100% { opacity: .55; }
  50% { opacity: .95; }
}

/* ---------- masthead ---------- */

.masthead {
  max-width: var(--shell);
  margin: 0 auto;
  padding: clamp(18px, 2.6vw, 30px) var(--pad);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  color: var(--ink);
}

.brand-mark {
  width: 30px; height: 30px;
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6;
  stroke-linecap: round;
}

.brand-name {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: .1em;
  line-height: 1;
}

.brand-sub {
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--muted);
  border-left: 1px solid var(--edge);
  padding-left: 11px;
  line-height: 1.5;
}

.clock {
  justify-self: end;
  display: grid;
  grid-template-columns: auto auto;
  grid-template-areas: "label time" "date date";
  align-items: baseline;
  column-gap: 10px;
  row-gap: 1px;
  text-align: right;
}

.clock-label {
  grid-area: label;
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--muted);
}

.clock-time {
  grid-area: time;
  font-size: clamp(24px, 2.4vw, 30px);
  font-weight: 300;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
}

.clock-date {
  grid-area: date;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .02em;
}

.mast-tools { display: flex; align-items: center; gap: 6px; }

.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  padding: 10px clamp(20px, 4.2vw, 52px);
  font-size: 13px;
  margin: 0 0 8px;
}
.banner[hidden] { display: none; }
.banner p { margin: 0; }
.banner .link-btn { color: var(--accent-deep); white-space: nowrap; }

/* ---------- sky band ---------- */

.sky {
  --sky-bg: #cfe1ea;
  --sky-ink: #12232c;
  --sky-muted: rgba(18, 35, 44, .66);
  --sky-line: rgba(18, 35, 44, .22);
  --sky-sun: #d99a2b;
  --sky-tint: rgba(18, 35, 44, .07);
  --sky-tint-hover: rgba(18, 35, 44, .13);
  --sky-dot-ring: rgba(18, 35, 44, .25);
  background: var(--sky-bg);
  color: var(--sky-ink);
  transition: background-color .8s var(--ease), color .8s var(--ease);
}

.sky[data-phase="dawn"] {
  --sky-bg: #efd4bb;
  --sky-ink: #2b1d15;
  --sky-muted: rgba(43, 29, 21, .66);
  --sky-line: rgba(43, 29, 21, .22);
  --sky-sun: #d8863a;
  --sky-tint: rgba(43, 29, 21, .07);
  --sky-tint-hover: rgba(43, 29, 21, .13);
}

.sky[data-phase="golden"] {
  --sky-bg: #e7b879;
  --sky-ink: #2a1c10;
  --sky-muted: rgba(42, 28, 16, .68);
  --sky-line: rgba(42, 28, 16, .24);
  --sky-sun: #f9e6b8;
  --sky-tint: rgba(42, 28, 16, .08);
  --sky-tint-hover: rgba(42, 28, 16, .15);
}

.sky[data-phase="dusk"] {
  --sky-bg: #a7959c;
  --sky-ink: #1d1720;
  --sky-muted: rgba(29, 23, 32, .68);
  --sky-line: rgba(29, 23, 32, .24);
  --sky-sun: #f0d8b4;
  --sky-tint: rgba(29, 23, 32, .08);
  --sky-tint-hover: rgba(29, 23, 32, .15);
}

.sky[data-phase="night"] {
  --sky-bg: #0f1728;
  --sky-ink: #edf1f7;
  --sky-muted: rgba(237, 241, 247, .66);
  --sky-line: rgba(237, 241, 247, .22);
  --sky-sun: #e9eef7;
  --sky-tint: rgba(255, 255, 255, .06);
  --sky-tint-hover: rgba(255, 255, 255, .12);
  --sky-dot-ring: rgba(255, 255, 255, .4);
}

.sky-inner {
  max-width: var(--shell);
  margin: 0 auto;
  padding: clamp(30px, 4.4vw, 56px) var(--pad) clamp(34px, 4.6vw, 58px);
  min-height: clamp(440px, 50vh, 600px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: clamp(40px, 5vw, 64px);
}

.sky-main {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(28px, 4vw, 64px);
}

.sky-copy { max-width: 920px; }

.headline {
  font-family: var(--serif);
  font-size: clamp(34px, 4.5vw, 58px);
  font-weight: 400;
  line-height: 1.14;
  letter-spacing: .005em;
  text-wrap: balance;
  max-width: 13em;
  margin: 0;
}

.insight {
  margin-top: clamp(16px, 2vw, 22px);
  max-width: 34ch;
  font-size: 14px;
  line-height: 1.7;
  color: var(--sky-muted);
  text-wrap: pretty;
}

/* solar arc */

.solar {
  flex: 0 0 auto;
  width: min(360px, 31vw);
  padding-top: 6px;
}

.solar-title {
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--sky-muted);
  margin: 0 0 2px;
}

.solar svg { width: 100%; height: auto; overflow: visible; }
.solar-arc { fill: none; stroke: var(--sky-line); stroke-width: 1.1; }
.solar-horizon { stroke: var(--sky-line); stroke-width: 1.1; }
.solar-tick { stroke: var(--sky-line); stroke-width: 1.1; }
.solar-disc { fill: var(--sky-sun); }
.solar-moon path { fill: none; stroke: var(--sky-sun); stroke-width: 1.5; stroke-linejoin: round; }
.solar-cap {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 2px;
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--sky-muted);
  font-variant-numeric: tabular-nums;
}
.solar-note {
  margin-top: 8px;
  font-size: 12px;
  color: var(--sky-muted);
  font-variant-numeric: tabular-nums;
}

/* city columns */

.city-row[data-count="3"] { gap: clamp(24px, 3vw, 44px); }
.city-row[data-count="3"] .city-temp { font-size: clamp(76px, 6.6vw, 100px); }

.city-row[data-count="4"] { gap: clamp(24px, 2.4vw, 36px); }
.city-row[data-count="5"],
.city-row[data-count="6"] { gap: clamp(20px, 2vw, 28px); }
.city-row[data-count="4"] .city,
.city-row[data-count="5"] .city,
.city-row[data-count="6"] .city {
  flex: 1 1 150px;
  min-width: 150px;
  max-width: none;
}
.city-row[data-count="4"] .city { flex-basis: 170px; min-width: 170px; }
.city-row[data-count="4"] .city-temp,
.city-row[data-count="5"] .city-temp,
.city-row[data-count="6"] .city-temp { font-size: clamp(68px, 6.1vw, 88px); }
.city-row[data-count="4"] .city-temp-line,
.city-row[data-count="5"] .city-temp-line,
.city-row[data-count="6"] .city-temp-line {
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.city-row[data-count="4"] .city-cond,
.city-row[data-count="5"] .city-cond,
.city-row[data-count="6"] .city-cond { padding-bottom: 0; font-size: 14px; }
.city-row[data-count="4"] .city-cond .glyph,
.city-row[data-count="5"] .city-cond .glyph,
.city-row[data-count="6"] .city-cond .glyph { font-size: 28px; }
.city-row[data-count="4"] .city-meta,
.city-row[data-count="5"] .city-meta,
.city-row[data-count="6"] .city-meta { min-height: 3.3em; }
.city-row[data-count="6"] .add-city { display: none; }

.swipe-hint {
  margin: 14px 0 0;
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--sky-muted);
}
.swipe-hint[hidden] { display: none; }

.city-row {
  display: flex;
  align-items: stretch;
  gap: clamp(24px, 3.4vw, 52px);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  padding-bottom: 2px;
}
.city-row::-webkit-scrollbar { display: none; }
.city-row.is-scrollable:not(.is-end) {
  -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 14px), transparent 100%);
  padding-right: 4px;
}

.city {
  position: relative;
  flex: 1 1 236px;
  min-width: 214px;
  max-width: 400px;
  scroll-snap-align: start;
  padding-top: 4px;
}

.city-region {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 18px;
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--sky-muted);
  margin-bottom: 12px;
}

.city-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--dot, var(--sky-sun));
  outline: 1px solid var(--sky-dot-ring);
  outline-offset: 1px;
  flex: none;
}

@supports (background: color-mix(in srgb, red, blue)) {
  .sky .city-dot { background: color-mix(in srgb, var(--dot, var(--sky-sun)) 62%, var(--sky-ink)); }
}

.city-name {
  font-family: var(--serif);
  font-size: clamp(22px, 2.3vw, 29px);
  font-weight: 400;
  letter-spacing: .03em;
  line-height: 1.2;
  margin: 0 0 4px;
  padding-right: 30px;
}

.city-remove {
  position: absolute;
  top: 0; right: 0;
  display: grid;
  place-items: center;
  width: 28px; height: 28px;
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--sky-muted);
  cursor: pointer;
  opacity: 0;
  transition: opacity .18s var(--ease), background-color .18s var(--ease), color .18s var(--ease);
}
.city-remove .ui-icon { width: 15px; height: 15px; }
.city:hover .city-remove,
.city:focus-within .city-remove { opacity: 1; }
.city-remove:hover { background: var(--sky-tint); color: var(--sky-ink); }

.city-temp-line {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 10px 18px;
  margin-top: 2px;
}

.city-temp {
  font-family: var(--serif);
  font-size: clamp(76px, 8.4vw, 112px);
  line-height: .82;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: flex-start;
}

.city-unit {
  font-size: .4em;
  line-height: 1;
  margin-top: .1em;
  margin-left: .015em;
  letter-spacing: 0;
  color: var(--sky-muted);
}

.city-cond {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-bottom: 9px;
  font-size: 15px;
  letter-spacing: .02em;
  white-space: nowrap;
}
.city-cond .glyph { font-size: 34px; stroke-width: 1.45; }

.city-meta {
  margin-top: 16px;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--sky-muted);
  font-variant-numeric: tabular-nums;
}
.city-meta b { font-weight: 500; color: var(--sky-ink); }

.city-aqi {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--sky-muted);
  font-variant-numeric: tabular-nums;
}

.aqi-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--aqi);
  flex: none;
}

.city--empty .city-temp { color: var(--sky-muted); }

.add-city {
  flex: 0 0 188px;
  margin-left: auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  gap: 16px;
  min-height: 0;
  padding: 20px;
  align-self: flex-start;
  border: 0;
  border-radius: 2px;
  background: var(--sky-tint);
  color: var(--sky-ink);
  text-align: left;
  cursor: pointer;
  scroll-snap-align: end;
  transition: background-color .2s var(--ease);
}
.add-city:hover { background: var(--sky-tint-hover); }
.add-city:disabled { cursor: default; background: var(--sky-tint); opacity: .6; }

.add-city-plus {
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--sky-ink);
  color: var(--sky-bg);
}
.add-city-plus .ui-icon { width: 17px; height: 17px; stroke-width: 2; }

.add-city-text {
  display: block;
  font-size: 14px;
  letter-spacing: .02em;
}
.add-city-text small {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--sky-muted);
}

/* ---------- sections ---------- */

.section {
  max-width: var(--shell);
  margin: 0 auto;
  padding: clamp(76px, 10vw, 132px) var(--pad) 0;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  margin-bottom: clamp(28px, 3.6vw, 44px);
}

.section-title {
  font-family: var(--serif);
  font-size: clamp(30px, 3.5vw, 44px);
  font-weight: 400;
  letter-spacing: .02em;
  line-height: 1.15;
}

.section-note {
  max-width: 36ch;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--muted);
  padding-bottom: 4px;
  text-wrap: pretty;
}

/* chart */

.chart-panel { position: relative; }

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 22px;
  margin-bottom: 18px;
  min-height: 26px;
}

.legend-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  border: 0;
  background: none;
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
  transition: opacity .18s var(--ease);
}
.legend-btn .legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--c);
  flex: none;
}
.legend-btn[aria-pressed="false"] { opacity: .34; }
.legend-btn:hover { opacity: .7; }
.legend-btn[aria-pressed="false"]:hover { opacity: .55; }

.chart-wrap { position: relative; }

.chart {
  width: 100%;
  height: auto;
  touch-action: pan-y;
  overflow: visible;
}
.chart text {
  font-family: var(--sans);
  font-size: 11px;
  fill: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chart .axis-line { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis-line--zero { stroke: rgba(191, 63, 40, .32); }
.chart .axis-label--zero { fill: rgba(191, 63, 40, .8); }
.chart .day-line { stroke: var(--chart-grid); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .day-label { fill: var(--muted); font-size: 10px; letter-spacing: .06em; }
.chart .series-path {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.chart .series-path.is-drawing { animation: draw-in 1.1s var(--ease) both; }
.chart .cursor-line { stroke: var(--ink); stroke-width: 1; opacity: .28; }
.chart .cursor-dot {
  stroke: var(--paper);
  stroke-width: 2;
  opacity: 0;
  transition: opacity .12s var(--ease);
}
.chart.is-active .cursor-dot { opacity: 1; }
.chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

@keyframes draw-in {
  from { stroke-dashoffset: var(--len); }
  to { stroke-dashoffset: 0; }
}

.chart-tip {
  position: absolute;
  top: 20px; left: 110px;
  z-index: 3;
  min-width: 176px;
  padding: 10px 12px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-size: 12px;
  line-height: 1.45;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, 0);
  transition: opacity .14s var(--ease);
  font-variant-numeric: tabular-nums;
}
.chart-tip.is-on { opacity: 1; }
.tip-time {
  color: rgba(243, 242, 238, .62);
  margin-bottom: 6px;
  letter-spacing: .02em;
}
.tip-row {
  display: grid;
  grid-template-columns: 7px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 7px;
  padding: 2px 0;
}
.tip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tip-name { color: rgba(243, 242, 238, .82); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip-val { font-weight: 600; }
.tip-cond { color: rgba(243, 242, 238, .6); font-size: 11px; white-space: nowrap; }

.chart-skeleton {
  height: clamp(260px, 32vw, 340px);
  background: var(--paper-2);
  animation: pulse 1.8s ease-in-out infinite;
}

.legend-temp { color: var(--muted); font-variant-numeric: tabular-nums; }

.line-skeleton {
  height: 20px;
  margin: 15px 0;
  background: var(--paper-2);
  animation: pulse 1.8s ease-in-out infinite;
}

/* table */

.table-scroll { overflow-x: auto; scrollbar-width: thin; }
.table-scroll::-webkit-scrollbar { height: 4px; }
.table-scroll::-webkit-scrollbar-thumb { background: var(--paper-3); }

.compare {
  width: 100%;
  min-width: 620px;
  font-size: 13.5px;
}

.compare thead th {
  padding: 0 14px 14px;
  text-align: center;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: .06em;
  color: var(--muted);
  white-space: nowrap;
}
.compare thead th.row-label {
  text-align: left;
  padding-left: 2px;
  color: var(--muted);
}
.compare thead .th-city {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--ink);
  font-size: 13px;
  letter-spacing: .03em;
}
.compare thead .th-city .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--c);
  flex: none;
}

.compare tbody tr { --row-bg: var(--paper); }
.compare tbody tr:nth-child(even) { --row-bg: var(--paper-2); }
.compare tbody tr:hover { --row-bg: var(--paper-3); }

.compare tbody th {
  position: sticky;
  left: 0;
  z-index: 1;
  width: 132px;
  padding: 13px 16px 13px 2px;
  background: var(--row-bg);
  text-align: left;
  font-weight: 400;
  color: var(--muted);
  white-space: nowrap;
  font-size: 12.5px;
  letter-spacing: .02em;
}

.compare tbody td {
  padding: 13px 14px;
  background: var(--row-bg);
  text-align: center;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.cell-cond { display: inline-flex; align-items: center; gap: 7px; }
.cell-cond .glyph { font-size: 22px; stroke-width: 1.55; }
.cell-aqi { display: inline-flex; align-items: center; gap: 6px; }
.cell-sub { color: var(--muted); font-size: 11.5px; }

.empty-state {
  padding: 20px 2px;
  font-size: 13px;
  color: var(--muted);
}

/* week */

.week-scroll { overflow-x: auto; scrollbar-width: thin; }
.week-scroll::-webkit-scrollbar { height: 4px; }
.week-scroll::-webkit-scrollbar-thumb { background: var(--paper-3); }

.week-table {
  width: 100%;
  min-width: 740px;
  font-variant-numeric: tabular-nums;
}

.week-table th,
.week-table td {
  padding: 14px 8px;
  background: var(--paper);
  text-align: center;
}

.week-table thead th {
  padding: 0 8px 14px;
  font-size: 11.5px;
  font-weight: 400;
  letter-spacing: .05em;
  color: var(--muted);
  vertical-align: bottom;
}
.week-table thead th.is-today { color: var(--ink); }
.week-head > span { display: block; }
.week-head .wk-date { margin-top: 2px; font-size: 10.5px; color: var(--muted); }
.week-table thead .week-corner {
  padding-left: 2px;
  text-align: left;
}

.week-table tbody tr:nth-child(even) th,
.week-table tbody tr:nth-child(even) td { background: var(--paper-2); }
.week-table tbody tr:hover th,
.week-table tbody tr:hover td { background: var(--paper-3); }

.week-table tbody th {
  padding-left: 2px;
  font-weight: 400;
  font-size: 13.5px;
  letter-spacing: .02em;
  text-align: left;
  white-space: nowrap;
}

.week-city {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.week-city .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

.week-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.week-cell .glyph { font-size: 23px; stroke-width: 1.5; color: var(--ink-soft); }
.week-cell .hi { font-size: 15px; }
.week-cell .lo { font-size: 11.5px; color: var(--muted); }

.only-mobile { display: none; }

/* ---------- footer ---------- */

.footer {
  margin-top: clamp(56px, 7vw, 92px);
  background: #151816;
  color: #f1efe6;
  padding: 22px var(--pad) calc(22px + env(safe-area-inset-bottom));
}

.footer-inner {
  max-width: var(--shell);
  margin: 0 auto;
}

.footer-credit {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.7;
  letter-spacing: .02em;
  color: rgba(241, 239, 230, .55);
}

.footer-credit a {
  color: rgba(241, 239, 230, .82);
  text-decoration-color: rgba(241, 239, 230, .3);
  text-underline-offset: 3px;
}

/* ---------- dialog ---------- */

.dialog {
  width: min(580px, calc(100vw - 28px));
  max-height: min(84vh, 760px);
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-float);
  overflow: hidden;
}
.dialog::backdrop { background: rgba(15, 23, 40, .5); }

.dialog-body {
  display: flex;
  flex-direction: column;
  max-height: min(84vh, 760px);
  padding: clamp(20px, 3.4vw, 32px) clamp(20px, 3.4vw, 34px) 20px;
}

.dialog-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.dialog-title {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 400;
  letter-spacing: .03em;
  margin: 0 0 6px;
}

.dialog-sub {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.search-field {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: var(--paper-2);
  border-radius: 2px;
  transition: background-color .18s var(--ease);
}
.search-field:focus-within { background: var(--paper-3); }
.search-field .ui-icon { color: var(--muted); }
.search-field input {
  flex: 1;
  min-width: 0;
  height: 48px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  outline: none;
}
.search-field input::placeholder { color: var(--muted); }
.search-field input::-webkit-search-cancel-button { display: none; }

.quick {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
}

.chip {
  padding: 6px 11px;
  border: 0;
  border-radius: 2px;
  background: var(--paper-2);
  color: var(--ink-soft);
  font-size: 12.5px;
  cursor: pointer;
  transition: background-color .16s var(--ease), color .16s var(--ease);
}
.chip:hover { background: var(--paper-3); color: var(--ink); }
.chip:disabled { opacity: .42; cursor: default; }

.results {
  margin-top: 16px;
  overflow-y: auto;
  min-height: 44px;
  max-height: 300px;
  scrollbar-width: thin;
}

.result-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 11px 2px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  border-top: 1px solid var(--edge);
  transition: background-color .16s var(--ease);
}
.result-row:hover { background: var(--paper-2); }
.result-row:disabled { cursor: default; }
.result-main { min-width: 0; }
.result-name {
  font-size: 14.5px;
  letter-spacing: .02em;
  display: block;
}
.result-region {
  display: block;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: .02em;
}
.result-add {
  flex: none;
  font-size: 12px;
  color: var(--accent);
  letter-spacing: .02em;
}
.result-row:disabled .result-add { color: var(--muted); }
.result-hint, .result-status {
  padding: 10px 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}

.dialog-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--edge);
}
.dialog-count { font-size: 11.5px; color: var(--muted); }

/* ---------- toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 80;
  transform: translate(-50%, 16px);
  padding: 10px 16px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-size: 13px;
  letter-spacing: .02em;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s var(--ease), transform .22s var(--ease);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

.noscript {
  position: fixed;
  left: 16px; right: 16px; bottom: 16px;
  z-index: 90;
  padding: 14px 18px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
}

/* ---------- reveal ---------- */

.js .reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .8s var(--ease), transform .8s var(--ease);
}
.js .reveal.is-in { opacity: 1; transform: none; }

.js .sky-copy { animation: rise .9s var(--ease) both; }
.js .solar { animation: fade 1.2s var(--ease) both .15s; }
.js .city-row--first .city,
.js .city-row--first .add-city {
  animation: rise .8s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 70ms + 120ms);
}

/* ---------- responsive ---------- */

@media (max-width: 1024px) {
  .sky-main { gap: 32px; }
  .solar { width: min(300px, 30vw); }
  .city { max-width: 340px; }
}

@media (max-width: 860px) {
  .solar { display: none; }
  .masthead {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "brand tools"
      "clock clock";
    align-items: center;
    row-gap: 12px;
  }
  .brand { grid-area: brand; }
  .mast-tools { grid-area: tools; justify-self: end; }
  .clock {
    grid-area: clock;
    justify-self: start;
    grid-template-columns: auto auto auto;
    grid-template-areas: "label time date";
    column-gap: 10px;
    text-align: left;
  }
  .clock-date { align-self: baseline; }
  .section-head { flex-direction: column; align-items: flex-start; gap: 12px; }
  .section-note { max-width: 46ch; }
  .footer-inner { grid-template-columns: 1fr; align-items: start; }
}

@media (max-width: 640px) {
  .brand-sub { display: none; }
  .brand-name { font-size: 22px; }
  .brand-mark { width: 27px; height: 27px; }

  .clock { grid-template-columns: auto auto; grid-template-areas: "label time" "date date"; row-gap: 2px; }
  .clock-time { font-size: 23px; }

  .mast-tools .btn--quiet { padding: 0; width: 42px; justify-content: center; }
  .mast-tools .btn--quiet .btn-label { display: none; }
  .btn { min-height: 40px; padding: 0 13px; font-size: 13.5px; }
  .btn--solid { padding: 0 14px; }

  .sky-inner {
    min-height: 0;
    gap: 40px;
    padding-top: 30px;
    padding-bottom: 34px;
  }
  .headline { font-size: clamp(30px, 8.4vw, 38px); }
  .insight { font-size: 13px; margin-top: 14px; max-width: 30ch; }
  .city-row { gap: 32px; }
  .city-row[data-count] .city { flex: 0 0 100%; max-width: none; min-width: 0; }
  .city-row[data-count] .city-temp { font-size: clamp(72px, 22vw, 92px); }
  .city-row[data-count] .city-temp-line { flex-direction: row; align-items: flex-end; gap: 10px 18px; }
  .city-row[data-count] .city-cond { padding-bottom: 9px; font-size: 15px; }
  .city-row[data-count] .city-cond .glyph { font-size: 30px; }
  .city-row[data-count="6"] .add-city { display: flex; }

  /* two cities sit side by side on a phone: the comparison stays visible */
  .city-row[data-count="2"] { gap: 18px; overflow-x: visible; }
  .city-row[data-count="2"] .city { flex: 1 1 0; min-width: 0; }
  .city-row[data-count="2"] .city-temp { font-size: clamp(58px, 16vw, 70px); }
  .city-row[data-count="2"] .city-temp-line { flex-direction: column; align-items: flex-start; gap: 8px; }
  .city-row[data-count="2"] .city-cond { padding-bottom: 0; font-size: 13.5px; }
  .city-row[data-count="2"] .city-cond .glyph { font-size: 26px; }
  .city-row[data-count="2"] .city-meta { font-size: 11px; margin-top: 12px; }
  .city-row[data-count="2"] .city-aqi { font-size: 10.5px; flex-wrap: wrap; }
  .city-row[data-count="2"] .add-city { display: none; }
  .city-temp { font-size: clamp(72px, 22vw, 92px); }
  .city-remove { opacity: .38; background: transparent; width: 24px; height: 24px; top: -2px; }
  .city-remove:active { opacity: .8; background: var(--sky-tint); }
  .add-city { flex: 0 0 100%; max-width: none; margin-left: 0; }

  .city-cond .glyph { font-size: 30px; }

  .section { padding-top: clamp(64px, 16vw, 88px); }
  .section-title { font-size: clamp(27px, 7.5vw, 34px); }

  .chart-legend { gap: 2px 16px; margin-bottom: 14px; }
  .legend-btn { font-size: 12px; }

  .compare {
    min-width: calc(84px + var(--city-count, 2) * 132px);
    width: 100%;
    table-layout: fixed;
    font-size: 12px;
  }
  .compare thead th { padding: 0 4px 12px; font-size: 10.5px; letter-spacing: .02em; }
  .compare thead th.row-label { width: 84px; padding-left: 0; }
  .compare thead .th-city { gap: 4px; font-size: 11.5px; }
  .compare tbody th {
    width: 84px;
    padding: 11px 4px 11px 0;
    white-space: normal;
    font-size: 11px;
    line-height: 1.4;
  }
  .compare tbody td { padding: 11px 4px; white-space: normal; font-size: 11.5px; }
  .compare .cell-cond { gap: 4px; }
  .compare .cell-cond .glyph { font-size: 18px; }
  .compare .cell-sub { font-size: 10px; }
  .week-table { min-width: 640px; }
  .only-mobile { display: inline; }

  .footer-word { font-size: clamp(52px, 18vw, 72px); }
  .footer-meta p { font-size: 12px; }

  .dialog-body { padding: 20px 18px 16px; }
  .dialog-title { font-size: 24px; }
  .results { max-height: 240px; }
  .toast { bottom: 18px; max-width: calc(100vw - 32px); text-align: center; }
}

@media (hover: none) {
  .city-remove { opacity: .6; }
  .city-remove:active { background: var(--sky-tint); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  .js .reveal { opacity: 1; transform: none; }
}

    const h = Number(isoLocal.slice(11, 13));

    if (!Number.isFinite(h) || !Number.isFinite(m)) return null;

    return rest === 0 ? `${h} 小时` : `${h} 小时 ${rest} 分`;

  const SEC_FMT = new Intl.DateTimeFormat('zh-CN', {

  });
  const HM_FMT = new Intl.DateTimeFormat('zh-CN', {

  });
  const DATE_FMT = new Intl.DateTimeFormat('zh-CN', {

  });
  const WEEK_FMT = new Intl.DateTimeFormat('zh-CN', { timeZone: BJ_TZ, weekday: 'short' });
  const PARTS_FMT = new Intl.DateTimeFormat('en-GB', {
    timeZone: BJ_TZ, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
  });

  function bjParts(date = new Date()) {
    const out = {};
    for (const part of PARTS_FMT.formatToParts(date)) {
      if (part.type !== 'literal') out[part.type] = part.value;
    }
    const hour = Number(out.hour) % 24;
    const minute = Number(out.minute);
    return {
      date: `${out.year}-${out.month}-${out.day}`,
      hour,
      minute,
      minutes: hour * 60 + minute
    };
  }

  function timeHM(dateLike) {
    if (!dateLike) return '—';
    return HM_FMT.format(new Date(dateLike));
  }

  function solarElevation(date, lat, lon) {
    const rad = Math.PI / 180;
    const jd = date.getTime() / 86400000 + 2440587.5;
    const n = jd - 2451545.0;
    const L = ((280.460 + 0.9856474 * n) % 360 + 360) % 360;
    const g = ((357.528 + 0.9856003 * n) % 360 + 360) % 360;
    const lambda = (L + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad)) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const decl = Math.asin(Math.sin(eps) * Math.sin(lambda));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)) / rad;
    const gmst = (18.697374558 + 24.06570982441908 * n) % 24;
    const lst = ((gmst + lon / 15) % 24 + 24) % 24;
    const hourAngle = ((((lst * 15 - ra) % 360) + 540) % 360) - 180;
    const sinEl = Math.sin(lat * rad) * Math.sin(decl) +
      Math.cos(lat * rad) * Math.cos(decl) * Math.cos(hourAngle * rad);
    return Math.asin(clamp(sinEl, -1, 1)) / rad;
  }

  function computePhase() {
    const ref = referenceCity();
    const lat = ref ? ref.lat : 39.9042;
    const lon = ref ? ref.lon : 116.4074;
    const now = new Date();
    const elev = solarElevation(now, lat, lon);
    const before = solarElevation(new Date(now.getTime() - 15 * 60000), lat, lon);
    if (elev >= 8) return 'day';
    if (elev >= 0) return before <= elev ? 'dawn' : 'golden';
    if (elev >= -10) return 'dusk';
    return 'night';
  }

  function normalizeCity(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const id = String(raw.id || '').slice(0, 64);
    const name = String(raw.name || '').slice(0, 24);
    const lat = Number(raw.lat);
    const lon = Number(raw.lon);
    if (!id || !name || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    return {
      id,
      name,
      short: String(raw.short || name).slice(0, 16),
      region: String(raw.region || '自定义地点').slice(0, 32),
      lat,
      lon
    };
  }

  function stripRegionSuffix(value) {

      .replace(/(特别行政区|自治区|自治州|自治县|新区|省|区|县|市|旗|盟)$/g, '')

        const province = stripRegionSuffix(row[2]);

        const region = [province, city]
          .filter(Boolean)

        return normalizeCity({

          name,
          short,

          lat: row[3],
          lon: row[4]

      name,
      short: name,
      region: regionParts.join(' · ') || '未知地区',
      lat: result.latitude,
      lon: result.longitude
    });
  }

  /* ---------------------------------------------------------------------
     Persistence
     --------------------------------------------------------------------- */
  function loadCities() {
    const known = new Map(PRESETS.map((c) => [c.id, c]));
    // 全国区县 ID 也要能从分享链接恢复
    for (const city of getPlaces()) {
      if (!known.has(city.id)) known.set(city.id, city);
    }
    const storedRaw = readJSON(safeGet(STORE_CITIES));
    const storedList = Array.isArray(storedRaw) ? storedRaw : [];

    for (const raw of storedList) {
      const city = normalizeCity(raw);
      if (city && !known.has(city.id)) known.set(city.id, city);
    }

    const params = new URLSearchParams(location.search);
    const rawParam = params.get('cities');
    let ids = null;
    if (rawParam) ids = rawParam.split(',').map((s) => s.trim()).filter(Boolean);
    else if (storedList.length) ids = storedList.map((c) => (typeof c === 'string' ? c : c && c.id)).filter(Boolean);
    if (!ids || !ids.length) return [];

    const picked = [];
    for (const id of ids) {
      if (id === 'here') continue;
      const city = known.get(id);
      if (city && !picked.some((c) => c.id === id) && picked.length < MAX_CITIES) picked.push(city);
    }
    // 上次的位置先恢复，随后会用浏览器定位更新
    const storedHere = storedList
      .map((raw) => normalizeCity(raw))
      .filter((city) => city && city.id === 'here')[0];
    if (storedHere) {
      storedHere.here = true;
      picked.unshift(storedHere);
    }
    return picked.slice(0, MAX_CITIES);
  }

  function loadCache() {
    const payload = readJSON(safeGet(STORE_CACHE));
    if (!payload || payload.v !== 2 || !payload.data || typeof payload.data !== 'object') return false;
    let count = 0;
    for (const [id, entry] of Object.entries(payload.data)) {
      if (!entry || !entry.forecast || !entry.forecast.current || !entry.forecast.hourly || !entry.forecast.daily) continue;
      state.data.set(id, entry);
      count += 1;

    state.fetchedAt = Number(payload.fetchedAt) || 0;

  /* ---------------------------------------------------------------------
     Network
     --------------------------------------------------------------------- */
  async function fetchJSON(url, timeout = 12000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, {
        signal: controller.signal,
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function forecastUrl(city) {
    const params = new URLSearchParams(FORECAST_PARAMS);
    params.set('latitude', String(city.lat));
    params.set('longitude', String(city.lon));
    return `${API.forecast}?${params.toString()}`;
  }

  function airUrl(city) {
    const params = new URLSearchParams(AIR_PARAMS);
    params.set('latitude', String(city.lat));
    params.set('longitude', String(city.lon));
    return `${API.air}?${params.toString()}`;
  }

  async function fetchCityData(city) {
    const [forecast, air] = await Promise.all([
      fetchJSON(forecastUrl(city)),
      fetchJSON(airUrl(city), 9000).catch(() => null)
    ]);
    if (!forecast || !forecast.current || !forecast.hourly || !forecast.daily) {
      throw new Error('Malformed forecast payload');
    }
    return { id: city.id, forecast, air, fetchedAt: Date.now() };
  }

  async function refresh() {
    if (refreshPromise) return refreshPromise;
    if (!state.cities.length) {
      state.loading = false;
      syncLoadingUI();
      renderAll();
      return 0;
    }
    state.loading = true;
    syncLoadingUI();
    const idsAtStart = new Set(state.cities.map((c) => c.id));

    refreshPromise = (async () => {
      const results = await Promise.allSettled(
        state.cities.map((city) => fetchCityData(city).then((data) => {
          if (!idsAtStart.has(city.id)) throw new Error('City removed');
          return data;
        }))
      );

      let ok = 0;
      for (const result of results) {
        if (result.status === 'fulfilled') {
          const entry = result.value;
          if (state.cities.some((c) => c.id === entry.id)) {
            state.data.set(entry.id, entry);
            ok += 1;
          }
        }
      }

      if (ok > 0) {
        state.fetchedAt = Date.now();
        state.lastError = false;
        saveCache();
        if (ok < state.cities.length && autoRetries < 3) {
          autoRetries += 1;
          setTimeout(() => { if (!refreshPromise) refresh(); }, 5000);
        } else if (ok === state.cities.length) {
          autoRetries = 0;
        }
      } else {
        state.lastError = true;
      }
      state.loading = false;
      syncLoadingUI();
      renderAll();
      refreshPromise = null;
      return ok;
    })().catch(() => {
      state.loading = false;
      state.lastError = true;
      syncLoadingUI();
      renderAll();
      refreshPromise = null;
      return 0;
    });

    return refreshPromise;
  }

  function syncLoadingUI() {
    if (!el.refreshBtn) return;
    el.refreshBtn.classList.toggle('is-loading', state.loading);
    el.refreshBtn.disabled = state.loading;
    el.refreshBtn.setAttribute('aria-busy', state.loading ? 'true' : 'false');
    if (el.locateBtn) {
      el.locateBtn.classList.toggle('is-loading', state.locating);
      el.locateBtn.disabled = state.locating;
      el.locateBtn.setAttribute('aria-busy', state.locating ? 'true' : 'false');
    }
  }
